<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#140c26"/><stop offset="1" stop-color="#030208"/></radialGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="neb1"><stop offset="0" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="hole"><stop offset=".55" stop-color="#000"/><stop offset=".7" stop-color="#a855f7" stop-opacity=".8"/><stop offset=".85" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse cx="250" cy="120" rx="300" ry="160" fill="url(#neb1)"><animate attributeName="rx" values="280;330;280" dur="8s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="980" cy="220" rx="280" ry="150" fill="url(#neb2)"><animate attributeName="rx" values="300;250;300" dur="9s" repeatCount="indefinite"/></ellipse>
  <g fill="#fff">
    <circle cx="80" cy="40" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="270" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="60" r="1"/><circle cx="470" cy="290" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="290" r="1"/><circle cx="1150" cy="70" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="1.1"/><circle cx="20" cy="200" r="1.2"/><circle cx="1180" cy="260" r="1"/>
  </g>
  <!-- black hole -->
  <g transform="translate(1040 110)">
    <circle r="70" fill="url(#hole)"><animate attributeName="r" values="66;76;66" dur="5s" repeatCount="indefinite"/></circle>
    <ellipse rx="110" ry="16" fill="none" stroke="#c4b5fd" stroke-opacity=".6" stroke-width="2" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" values="-18;-14;-18" dur="6s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- planet -->
  <g transform="translate(150 230)">
    <animateTransform attributeName="transform" type="translate" values="150 230;150 220;150 230" dur="6s" repeatCount="indefinite"/>
    <circle r="34" fill="#4c1d95"/><circle r="34" fill="url(#neb2)"/>
    <ellipse rx="58" ry="10" fill="none" stroke="#06b6d4" stroke-opacity=".7" stroke-width="2" transform="rotate(-15)"/>
  </g>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="10" fill="url(#txt)">AXRYZURE</text>
  <text x="600" y="198" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" fill="#c4b5fd" letter-spacing="12">THE HYSTORI COSMIC</text>
  <text x="600" y="245" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#94a3b8">"Kisah dari luar batas realitas..."</text>
</svg>
