  <style>
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #12121f;

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);

      display:flex;
      align-items:center;

    /* LOGIN */
    #login-screen {
      width:100%; max-width:420px; padding:2rem;
      background:var(--bg-secondary);
      border:1px solid var(--border-color);
      border-radius:1.5rem;

      text-align:center; position:relative; overflow:hidden;
    }
    #login-screen::before {
      content:""; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
      background: conic-gradient(from 180deg, transparent, rgba(168,85,247,0.1), transparent, rgba(6,182,212,0.1), transparent);
      animation: rotateGlow 8s linear infinite; pointer-events:none;
    }
    @keyframes rotateGlow { from { transform:rotate(0deg);} to { transform:rotate(360deg);} }
    #login-screen h1 {
      font-size:2.2rem; font-weight:800; letter-spacing:2px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:0.5rem; position:relative; z-index:1;
    }
    #login-screen p { color:var(--text-secondary); font-size:0.9rem; margin-bottom:2rem; position:relative; z-index:1; }
    .login-form { display:flex; flex-direction:column; gap:1rem; position:relative; z-index:1; }
    .login-form input {
      padding:0.9rem 1.2rem; background:var(--bg-primary);
      border:1px solid var(--border-color); border-radius:0.75rem;
      color:var(--text-primary); font-size:1rem; outline:none;
      transition:border 0.2s, box-shadow 0.2s;

    .btn {
      padding:0.8rem 1.5rem; background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border:none; border-radius:0.75rem; color:white; font-weight:600; font-size:1rem;
      cursor:pointer; transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; letter-spacing:1px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(168,85,247,0.3); }
    .btn:active { transform: translateY(0); }
    .btn-outline { background:transparent; border:1px solid var(--border-color); color:var(--text-primary); }
    .btn-outline:hover { border-color:var(--accent-1); background:rgba(168,85,247,0.05); box-shadow:none; }
    .btn-danger { background:var(--danger); box-shadow:0 4px 15px rgba(239,68,68,0.2); }
    .btn-sm { padding:0.5rem 0.9rem; font-size:0.85rem; }

    /* APP */
    #app-screen { display:none; width:100%; height:100vh; flex-direction:column; }
    .app-header {
      background:var(--bg-secondary); border-bottom:1px solid var(--border-color);

      flex-wrap:wrap; gap:0.5rem;
    }
    .app-header h1 {
      font-size:1.4rem; font-weight:700; letter-spacing:1px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .user-info { display:flex; align-items:center; gap:1rem; }
    .user-info span { color:var(--text-secondary); font-size:0.9rem; }

    .app-body { display:flex; flex:1; overflow:hidden; }
    .sidebar {
      width:280px; background:var(--bg-secondary); border-right:1px solid var(--border-color);
      padding:1.5rem 1rem; overflow-y:auto; display:flex; flex-direction:column; gap:1rem;

    .sidebar h2 { font-size:0.85rem; text-transform:uppercase; letter-spacing:2px; color:var(--text-secondary); margin-bottom:0.5rem; }
    .search-box {

    }
    .search-box:focus { border-color:var(--accent-2); }
    .story-list { list-style:none; display:flex; flex-direction:column; gap:0.6rem; }
    .story-list-item {
      padding:0.8rem 1rem; background:var(--bg-card); border:1px solid var(--border-color);
      border-radius:0.6rem; cursor:pointer; transition: border 0.2s, background 0.2s; font-weight:500;
    }
    .story-list-item:hover { border-color:var(--accent-1); background:rgba(168,85,247,0.05); }
    .story-list-item.active { border-color:var(--accent-1); background:rgba(168,85,247,0.1); box-shadow:0 0 15px rgba(168,85,247,0.1); }
    .story-list-item .story-desc { font-size:0.75rem; color:var(--text-secondary); margin-top:0.25rem; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .story-actions { display:flex; gap:0.3rem; margin-top:0.5rem; }

    .main-content { flex:1; padding:1.5rem 2rem; overflow-y:auto; background:var(--bg-primary); }
    .chapter-list-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:0.8rem; }
    .chapter-list-header h2 { font-size:1.3rem; color:var(--accent-glow); }
    .chapter-buttons { display:flex; gap:0.5rem; }
    .chapter-item {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:0.7rem;
      padding:1rem 1.2rem; margin-bottom:0.8rem; cursor:pointer;

    .chapter-item .chapter-actions { display:flex; gap:0.4rem; }
    .reader-view {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:1rem;
      padding:2rem; max-width:900px; margin:0 auto; line-height:1.8; white-space:pre-wrap; font-size:0.95rem;
    }
    .reader-view h3 { font-size:1.8rem; margin-bottom:1.5rem; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    /* MODAL */
    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:1rem; }
    .modal-overlay.active { display:flex; }
    .modal { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:1rem; padding:2rem; width:100%; max-width:700px; max-height:90vh; overflow-y:auto; box-shadow:0 0 60px rgba(0,0,0,0.8), 0 0 30px rgba(168,85,247,0.2); }
    .modal h2 { margin-bottom:1.5rem; font-size:1.4rem; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .form-group { margin-bottom:1.2rem; }
    .form-group label { display:block; margin-bottom:0.4rem; font-weight:500; color:var(--text-secondary); font-size:0.9rem; }
    .form-group input, .form-group textarea { width:100%; padding:0.8rem 1rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:0.6rem; color:var(--text-primary); font-size:0.95rem; outline:none; }
    .form-group textarea { min-height:200px; resize:vertical; font-family:'Courier New', monospace; line-height:1.6; }
    .form-actions { display:flex; gap:0.8rem; margin-top:1.5rem; justify-content:flex-end; }

    @media (max-width:768px) {
      .app-body { flex-direction:column; }
      .sidebar { width:100%; height:auto; max-height:200px; border-right:none; border-bottom:1px solid var(--border-color); }
      .main-content { padding:1rem; }
      .reader-view { padding:1.2rem; }
      .app-header h1 { font-size:1.1rem; }
    }
  </style>
</head>

  <script>
    // ========== DATA AWAL (DENGAN BEBERAPA CERITA) ==========
    const defaultStories = [
      {
        id: 'asmodeus-vs-azatoth',
        title: 'ASMODEUS VS AZATOTH',
        description: 'Perang di luar pemahaman antara keteraturan dan kekacauan.',
        chapters: [
          {
            title: 'The War Beyond Existence',
            content: `Tidak ada langit.
Tidak ada bumi.
Tidak ada ruang.
Bahkan kata "tidak ada" belum memiliki makna.

Di tempat yang berada sebelum konsep keberadaan dilahirkan, terdapat sebuah wilayah yang tidak bisa disebut alam.
Namanya: THE NULL CATHEDRAL.

Di sanalah sesuatu berdiri.
Enam pasang sayap hitam terbentang tanpa bergerak.
Tubuhnya seperti manusia, tetapi wajahnya tidak pernah selesai terbentuk. Di balik kepalanya terdapat lingkaran mahkota yang terbuat dari pecahan hukum realitas.

Namanya adalah— ASMODEUS.
Penguasa dari kehendak yang menolak tunduk.
Ia bukan pencipta. Ia bukan penghancur.
Ia adalah sesuatu yang jauh lebih berbahaya: sebuah kehendak yang mampu menolak aturan yang seharusnya mutlak.

Asmodeus mengangkat kepalanya.
Di hadapannya terdapat sebuah pintu.
Pintu itu tidak terbuat dari materi.
Pintu itu adalah batas antara sesuatu yang bisa dipahami dan sesuatu yang bahkan tidak boleh dipahami.

Asmodeus tersenyum.
"Jadi di balik ini…" Tangannya menyentuh pintu. "…adalah adiknya."

KRAAAAK.
Retakan muncul. Bukan pada pintu. Tetapi pada konsep jarak.
Seketika seluruh Null Cathedral bergetar.
Asmodeus tertawa kecil. "Azatoth."
Satu nama. Hanya satu nama. Namun jutaan hukum primordial langsung berhenti bekerja.

Kemudian— TOK.
Satu langkah terdengar dari balik pintu. Asmodeus berhenti tersenyum.
TOK. Langkah kedua. Kegelapan mulai kehilangan bentuknya.
TOK. Langkah ketiga. Dan akhirnya pintu itu terbuka.

Tidak ada sosok raksasa. Tidak ada monster. Tidak ada aura penghancur.
Hanya seorang pemuda dengan pakaian sederhana berdiri di sana. Wajahnya tenang. Matanya kosong.
Namun di dalam kekosongan itu terdapat sesuatu yang membuat Asmodeus untuk pertama kalinya merasa… diam.

Azatoth menatapnya. "Kenapa kau datang?"
Asmodeus mengangkat kedua tangannya. "Aku datang untuk membuktikan sesuatu." "Apa?" "Bahwa tidak ada makhluk yang benar-benar absolut."
Azatoth tidak menjawab. Asmodeus tersenyum. "Bahkan kau."

Hening. Lalu Azatoth berkata pelan: "Kalau begitu…" Ia menatap Asmodeus. "…buktikan."

THE FIRST MOVEMENT
Asmodeus menghilang. Bukan bergerak cepat. Bukan teleportasi. Ia menghapus konsep posisinya sendiri.
Dalam sepersekian detik yang bahkan tidak bisa disebut waktu, Asmodeus sudah berada di belakang Azatoth. Tangannya terangkat.
NULL SOVEREIGNTY.
Satu pukulan. Tidak ada ledakan. Tidak ada suara.
Namun seluruh kemungkinan masa depan Azatoth terpotong. Dalam semua kemungkinan— Azatoth kalah.
Asmodeus tersenyum. "Sudah selesai."
Azatoth masih berdiri. Asmodeus terdiam.
Azatoth menoleh. "Tidak."
Seketika seluruh kemungkinan yang telah dipotong kembali muncul. Satu demi satu. Tak terhingga.
Asmodeus melihatnya. "Bagaimana?"
Azatoth menjawab: "Aku tidak memilih masa depan." Asmodeus membeku. "Aku adalah alasan mengapa masa depan memiliki kemungkinan."
BOOM. Realitas pecah.

THE SECOND MOVEMENT
Asmodeus membuka keenam sayapnya. Dari setiap sayap muncul jutaan simbol.
Nama-nama primordial. Hukum. Konsep. Kausalitas. Waktu. Ruang. Kematian. Kelahiran. Identitas.
Bahkan definisi tentang "Azatoth" mulai terkoyak.
Asmodeus berteriak: "Kalau begitu aku akan menghancurkan definisimu!"
Ia menarik seluruh simbol itu menjadi satu titik. Kemudian— ABSOLUTE CONCEPT ERASURE.
Serangan itu tidak menyerang tubuh. Ia menyerang makna keberadaan.
Jika berhasil, Azatoth tidak akan mati. Karena untuk mati, seseorang harus terlebih dahulu memiliki eksistensi.
Azatoth akan dibuat menjadi sesuatu yang tidak pernah memiliki arti untuk ada.
Serangan tersebut mengenai Azatoth. Hening. Asmodeus tersenyum.
Namun kemudian Azatoth berkata: "Menarik."
Satu kata. Serangan itu berhenti. Asmodeus terkejut. "Kenapa?"
Azatoth melihat simbol-simbol yang mengelilinginya. "Karena kau mencoba menghapus sesuatu yang tidak pernah bergantung pada definisi."
Azatoth mengangkat satu jari. TING.
Seluruh simbol Asmodeus berubah menjadi cahaya. Lalu menghilang.
Asmodeus mundur. Untuk pertama kalinya— darah hitam menetes dari sudut mulutnya.
Ia menyentuhnya. Melihat tangannya. Lalu tertawa. "Hahaha…" Tawanya semakin keras. "HAHAAHAHAHA!"
Azatoth tetap diam. Asmodeus mengangkat kepalanya. "Sekarang aku mengerti." "Apa?" "Kenapa IATIA tidak pernah membiarkanmu turun ke tingkat bawah."
Azatoth tidak menjawab. Asmodeus mengepalkan tangan. "Karena kalau kau benar-benar serius…" Ia tersenyum. "…seluruh hierarki eksistensi tidak akan punya alasan untuk tetap berdiri."

THE THIRD MOVEMENT
Asmodeus membuka matanya. Di dalam pupilnya muncul sesuatu yang belum pernah terlihat sebelumnya. THE FORBIDDEN THRONE.
Sebuah kekuatan yang bahkan Asmodeus sendiri selama ini tidak pernah gunakan.
Langit yang tidak ada berubah menjadi merah. Lantai Null Cathedral berubah menjadi putih.
Kemudian— jutaan primordial beings muncul di belakang Asmodeus.
Mereka adalah pasukan yang lahir sebelum konsep malaikat, iblis, dewa, dan monster. Mereka bukan prajurit. Mereka adalah fondasi perang.
Asmodeus menunjuk Azatoth. "Serang."
Pasukan itu bergerak. Satu juta. Seratus juta. Satu miliar. Tak terhingga.
Namun Azatoth tidak bergerak. Ia hanya berkata: "Diam."
SIR. Satu kata. SIR.
Tidak ada ledakan. Tidak ada cahaya. Tidak ada kehancuran.
Semua makhluk berhenti. Bukan karena diperintah. Mereka berhenti karena konsep gerakan untuk sementara kehilangan izin untuk eksis.
Pasukan Asmodeus membeku. Asmodeus sendiri ikut diam. Matanya melebar. "Tidak…"
Azatoth berjalan melewati pasukan itu. Setiap langkahnya membuat satu lapisan realitas kembali muncul.
Dunia. Galaksi. Dimensi. Multiverse. Hyperverse. Outer realms. Semua muncul hanya karena ia berjalan.
Asmodeus menatapnya. "Jadi ini kekuatanmu…"
Azatoth berhenti. "Bukan." Ia menoleh. "Ini hanya caraku berjalan."
Asmodeus tertawa pelan. "Gila…"
Kemudian ia mencabut sesuatu dari dadanya. Sebuah pedang hitam.
Tidak memiliki nama. Tidak memiliki bentuk tetap. Tidak memiliki sejarah.
Namun ketika pedang itu muncul— Azatoth akhirnya berhenti.
Asmodeus menggenggamnya. "Kalau semua hukum bisa kau hentikan…" Ia mengarahkan pedang tersebut. "…maka aku akan menggunakan sesuatu yang tidak memiliki hukum."
THE LAST BLADE.
Pedang itu bergerak. Tidak cepat. Tidak lambat. Ia hanya— terjadi.
Ujung pedang menembus dada Azatoth. Asmodeus membeku.
Azatoth melihat pedang tersebut. Kemudian melihat Asmodeus. "Bagus."
Asmodeus terkejut. "Bagus?"
Azatoth memegang pedang itu. "Setidaknya kau berhasil menyentuhku."
Asmodeus tersenyum. "Bukan itu tujuanku." "Apa?" Asmodeus mendekat. "Ini."
Pedang tersebut retak. Bukan karena Azatoth menghancurkannya. Tetapi karena Asmodeus telah memasukkan seluruh keberadaannya ke dalam satu serangan.
Tubuh Asmodeus mulai pecah. Sayapnya terbakar. Mahkotanya runtuh. Eksistensinya mulai menghilang.
Namun ia tersenyum. "Sekarang aku tahu jawabannya."
Azatoth diam. Asmodeus berbisik: "Makhluk absolut bukanlah makhluk yang tidak bisa dikalahkan."
Retakan menyebar ke seluruh tubuhnya. "Makhluk absolut adalah makhluk yang…" Ia menatap Azatoth. "…tidak membutuhkan kemenangan untuk membuktikan dirinya."
Tubuh Asmodeus hancur menjadi jutaan pecahan cahaya hitam. Azatoth tetap berdiri. Pedang itu lenyap. Perang berakhir.

Namun— Azatoth melihat satu hal. Di tempat Asmodeus menghilang… terdapat sebuah mata kecil.
Mata itu terbuka. Sebuah suara terdengar. "Pertarungan ini…" "…belum selesai."
Azatoth menatap mata tersebut. Untuk pertama kalinya, ia tersenyum. "Memang."
Kemudian Azatoth menghilang.`
          },
          {
            title: 'The Gate of the Absolute Outside',
            content: `Azatoth berdiri di tengah Null Cathedral yang hancur.
Di sekelilingnya, sisa-sisa pertempuran masih menggantung seperti bayangan yang enggan pergi.

Namun Azatoth tidak memperhatikan semua itu. Matanya tertuju pada satu hal. Sebuah mata kecil.
Mata itu terbuka di tempat Asmodeus menghilang. Dan mata itu menatap Azatoth.

      if (!title || !content) { alert('Judul dan isi bab wajib diisi.'); return; }
      const story = stories.find(s => s.id === currentStoryId);
      if (!story) return;
      story.chapters.push({ title, content });
      saveStories();
      closeModal('modal-add-chapter');
      newChapterTitle.value = '';
      newChapterContent.value = '';
      renderChapterList(currentStoryId);
    });

    // Update Chapter
    btnUpdateChapter.addEventListener('click', () => {
      const storyId = window._editStoryId;
      const chapterIndex = window._editChapterIndex;
      if (!storyId || chapterIndex === undefined) return;
      const story = stories.find(s => s.id === storyId);
      if (!story || chapterIndex >= story.chapters.length) return;
      const title = editChapterTitle.value.trim();
      const content = editChapterContent.value.trim();
      if (!title || !content) { alert('Judul dan isi tidak boleh kosong.'); return; }
      story.chapters[chapterIndex].title = title;
      story.chapters[chapterIndex].content = content;
      saveStories();
      closeModal('modal-edit-chapter');
      renderChapterList(storyId);
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });

    // ========== INIT ==========
    loadStories();
    loadUser();
  </script>
</body>
</html>
